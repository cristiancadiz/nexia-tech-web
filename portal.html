<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal Nexia | Conversaciones</title>
  <meta name="description" content="Portal de clientes Nexia Tech para visualizar conversaciones y mensajes.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#050816;
      --bg2:#0b1024;
      --panel:#0f1630;
      --panel2:#121b3c;
      --line:rgba(255,255,255,.10);
      --text:#f6f8ff;
      --muted:#9eabc8;
      --cyan:#4de7ff;
      --violet:#8c6cff;
      --green:#25D366;
      --danger:#ff6b7a;
      --shadow:0 20px 60px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:
      radial-gradient(circle at 10% 0%,rgba(77,231,255,.10),transparent 28%),
      radial-gradient(circle at 90% 10%,rgba(140,108,255,.12),transparent 30%),
      var(--bg);color:var(--text)}
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}

    .login-screen{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .login-card{
      width:min(430px,100%);
      background:rgba(15,22,48,.92);
      border:1px solid var(--line);
      border-radius:28px;
      padding:34px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(14px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      letter-spacing:.08em;
      margin-bottom:26px;
    }
    .brand-mark{
      width:38px;height:38px;border-radius:12px;
      background:linear-gradient(135deg,var(--cyan),var(--violet));
      box-shadow:0 0 30px rgba(77,231,255,.25);
    }
    .login-card h1{font-size:2rem;margin:0 0 8px}
    .login-card p{color:var(--muted);margin:0 0 26px;line-height:1.55}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.88rem;color:#cfd6ea;margin-bottom:7px}
    .field input{
      width:100%;
      border:1px solid var(--line);
      background:#091027;
      color:var(--text);
      border-radius:14px;
      padding:14px 15px;
      outline:none;
    }
    .field input:focus{border-color:rgba(77,231,255,.55);box-shadow:0 0 0 3px rgba(77,231,255,.08)}
    .primary-btn{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px 18px;
      font-weight:800;
      color:#031017;
      background:linear-gradient(135deg,var(--cyan),#80ffc1);
    }
    .error{
      margin-top:14px;
      color:#ffd2d7;
      background:rgba(255,107,122,.10);
      border:1px solid rgba(255,107,122,.25);
      border-radius:12px;
      padding:11px 12px;
      font-size:.9rem;
    }

    .app{
      min-height:100vh;
      display:grid;
      grid-template-rows:72px 1fr;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:0 24px;
      border-bottom:1px solid var(--line);
      background:rgba(5,8,22,.82);
      backdrop-filter:blur(14px);
      position:sticky;
      top:0;
      z-index:20;
    }
    .top-left{display:flex;align-items:center;gap:14px}
    .top-title small{display:block;color:var(--muted);font-size:.75rem}
    .top-title strong{font-size:1rem}
    .top-actions{display:flex;align-items:center;gap:10px}
    .ghost-btn{
      border:1px solid var(--line);
      background:#0c1330;
      color:var(--text);
      border-radius:12px;
      padding:10px 13px;
    }

    .workspace{
      min-height:0;
      display:grid;
      grid-template-columns:360px 1fr;
    }

    .sidebar{
      min-height:0;
      border-right:1px solid var(--line);
      background:rgba(8,13,31,.84);
      display:flex;
      flex-direction:column;
    }
    .sidebar-head{
      padding:18px;
      border-bottom:1px solid var(--line);
    }
    .sidebar-head h2{font-size:1rem;margin:0 0 12px}
    .search{
      width:100%;
      border:1px solid var(--line);
      background:#0b122b;
      color:var(--text);
      border-radius:12px;
      padding:11px 12px;
      outline:none;
    }
    .conversation-list{
      overflow:auto;
      flex:1;
    }
    .conversation-item{
      display:block;
      width:100%;
      text-align:left;
      border:0;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:transparent;
      color:var(--text);
      padding:16px 18px;
    }
    .conversation-item:hover{background:rgba(255,255,255,.035)}
    .conversation-item.active{background:rgba(77,231,255,.08);border-left:3px solid var(--cyan)}
    .conv-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .conv-name{font-weight:800}
    .conv-phone{font-size:.78rem;color:var(--muted);margin-top:2px}
    .conv-time{font-size:.72rem;color:var(--muted);white-space:nowrap}
    .conv-last{font-size:.87rem;color:#bbc5dc;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{padding:24px;color:var(--muted);text-align:center}

    .chat{
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      background:
        radial-gradient(circle at 70% 0%,rgba(140,108,255,.06),transparent 28%),
        #070c1e;
    }
    .chat-empty{
      flex:1;
      display:grid;
      place-items:center;
      color:var(--muted);
      text-align:center;
      padding:30px;
    }
    .chat-head{
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:0 22px;
      border-bottom:1px solid var(--line);
      background:rgba(10,16,38,.82);
    }
    .chat-head h3{margin:0;font-size:1rem}
    .chat-head p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
    .messages{
      flex:1;
      overflow:auto;
      padding:26px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .msg{
      max-width:min(680px,78%);
      padding:12px 14px 9px;
      border-radius:16px;
      line-height:1.45;
      box-shadow:0 8px 26px rgba(0,0,0,.14);
    }
    .msg.in{
      align-self:flex-start;
      background:#111a36;
      border:1px solid var(--line);
      border-bottom-left-radius:6px;
    }
    .msg.out{
      align-self:flex-end;
      background:linear-gradient(135deg,rgba(77,231,255,.20),rgba(140,108,255,.20));
      border:1px solid rgba(77,231,255,.18);
      border-bottom-right-radius:6px;
    }
    .msg-time{
      display:block;
      margin-top:6px;
      font-size:.68rem;
      color:var(--muted);
      text-align:right;
    }

    .loading{
      position:fixed;
      inset:0;
      z-index:999;
      display:grid;
      place-items:center;
      background:rgba(5,8,22,.76);
      backdrop-filter:blur(6px);
    }
    .loader-box{
      background:#0f1630;
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px 24px;
      box-shadow:var(--shadow);
    }

    @media(max-width:820px){
      .workspace{grid-template-columns:1fr}
      .sidebar{border-right:0}
      .chat{display:none}
      .app.mobile-chat .sidebar{display:none}
      .app.mobile-chat .chat{display:flex}
      .topbar{padding:0 14px}
    }
  </style>
</head>

<body>

<div id="loading" class="loading hidden">
  <div class="loader-box">Cargando...</div>
</div>

<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark"></span>
      NEXIA TECH
    </div>

    <h1>Portal de clientes</h1>
    <p>Ingresa para revisar las conversaciones asociadas a tu empresa.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="primary-btn" type="submit">Ingresar</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>
</section>

<section id="app" class="app hidden">
  <header class="topbar">
    <div class="top-left">
      <span class="brand-mark"></span>
      <div class="top-title">
        <small>Portal Nexia</small>
        <strong id="empresaNombre">Mi empresa</strong>
      </div>
    </div>

    <div class="top-actions">
      <button id="backBtn" class="ghost-btn hidden" type="button">← Conversaciones</button>
      <button id="refreshBtn" class="ghost-btn" type="button">Actualizar</button>
      <button id="logoutBtn" class="ghost-btn" type="button">Salir</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Conversaciones</h2>
        <input id="searchInput" class="search" placeholder="Buscar por nombre o teléfono">
      </div>
      <div id="conversationList" class="conversation-list"></div>
    </aside>

    <main class="chat">
      <div id="chatEmpty" class="chat-empty">
        <div>
          <h2>Selecciona una conversación</h2>
          <p>Los mensajes aparecerán aquí.</p>
        </div>
      </div>

      <div id="chatContent" class="hidden" style="display:flex;flex:1;min-height:0;flex-direction:column">
        <div class="chat-head">
          <div>
            <h3 id="chatName"></h3>
            <p id="chatPhone"></p>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </div>
    </main>
  </div>
</section>

<script>
  // ============================================================
  // CONFIGURACIÓN SUPABASE
  // ============================================================
  // 1) Reemplaza SUPABASE_URL con la URL de tu proyecto.
  // 2) Reemplaza SUPABASE_ANON_KEY con la clave "anon public".
  //
  // IMPORTANTE:
  // Usa SOLO la clave anon/public en esta página.
  // NO pongas aquí la service_role key.
  // ============================================================

  const SUPABASE_URL = 'https://nappdpkjtdzwtiuvrrhk.supabase.co';
  const SUPABASE_ANON_KEY = 'PEGA_AQUI_TU_ANON_KEY';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const els = {
    loading: document.getElementById('loading'),
    loginScreen: document.getElementById('loginScreen'),
    app: document.getElementById('app'),
    loginForm: document.getElementById('loginForm'),
    loginError: document.getElementById('loginError'),
    email: document.getElementById('email'),
    password: document.getElementById('password'),
    empresaNombre: document.getElementById('empresaNombre'),
    conversationList: document.getElementById('conversationList'),
    searchInput: document.getElementById('searchInput'),
    chatEmpty: document.getElementById('chatEmpty'),
    chatContent: document.getElementById('chatContent'),
    chatName: document.getElementById('chatName'),
    chatPhone: document.getElementById('chatPhone'),
    messages: document.getElementById('messages'),
    refreshBtn: document.getElementById('refreshBtn'),
    logoutBtn: document.getElementById('logoutBtn'),
    backBtn: document.getElementById('backBtn')
  };

  let conversaciones = [];
  let conversacionActiva = null;
  let realtimeChannel = null;

  function setLoading(value){
    els.loading.classList.toggle('hidden', !value);
  }

  function escapeHtml(value=''){
    return String(value)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }

  function formatDate(value){
    if(!value) return '';
    const d = new Date(value);
    return d.toLocaleString('es-CL',{
      day:'2-digit',
      month:'2-digit',
      hour:'2-digit',
      minute:'2-digit'
    });
  }

  function formatTime(value){
    if(!value) return '';
    const d = new Date(value);
    return d.toLocaleTimeString('es-CL',{
      hour:'2-digit',
      minute:'2-digit'
    });
  }

  async function loadProfile(){
    const { data: userData, error: userError } = await supabaseClient.auth.getUser();

    if(userError || !userData?.user){
      throw new Error('No se pudo identificar al usuario.');
    }

    const { data: perfil, error: perfilError } = await supabaseClient
      .from('perfiles')
      .select('id,nombre,email,rol,empresa_id,empresas(nombre)')
      .eq('id', userData.user.id)
      .single();

    if(perfilError){
      throw new Error('El usuario existe, pero aún no tiene un perfil asociado a una empresa.');
    }

    els.empresaNombre.textContent = perfil.empresas?.nombre || 'Mi empresa';
    return perfil;
  }

  async function loadConversations(){
    const { data, error } = await supabaseClient
      .from('conversaciones')
      .select('id,telefono,nombre_contacto,ultimo_mensaje,ultima_fecha,created_at')
      .order('ultima_fecha',{ascending:false});

    if(error) throw error;

    conversaciones = data || [];
    renderConversations();
  }

  function renderConversations(){
    const q = els.searchInput.value.trim().toLowerCase();

    const filtradas = conversaciones.filter(c => {
      const name = (c.nombre_contacto || '').toLowerCase();
      const phone = (c.telefono || '').toLowerCase();
      return !q || name.includes(q) || phone.includes(q);
    });

    if(!filtradas.length){
      els.conversationList.innerHTML = '<div class="empty">No hay conversaciones para mostrar.</div>';
      return;
    }

    els.conversationList.innerHTML = filtradas.map(c => `
      <button class="conversation-item ${conversacionActiva?.id === c.id ? 'active' : ''}"
              data-id="${escapeHtml(c.id)}">
        <div class="conv-row">
          <div>
            <div class="conv-name">${escapeHtml(c.nombre_contacto || 'Sin nombre')}</div>
            <div class="conv-phone">${escapeHtml(c.telefono || '')}</div>
          </div>
          <div class="conv-time">${escapeHtml(formatDate(c.ultima_fecha))}</div>
        </div>
        <div class="conv-last">${escapeHtml(c.ultimo_mensaje || 'Sin mensajes')}</div>
      </button>
    `).join('');

    document.querySelectorAll('.conversation-item').forEach(btn => {
      btn.addEventListener('click', () => openConversation(btn.dataset.id));
    });
  }

  async function openConversation(id){
    const c = conversaciones.find(x => x.id === id);
    if(!c) return;

    conversacionActiva = c;
    renderConversations();

    els.chatEmpty.classList.add('hidden');
    els.chatContent.classList.remove('hidden');
    els.chatName.textContent = c.nombre_contacto || 'Sin nombre';
    els.chatPhone.textContent = c.telefono || '';

    if(window.innerWidth <= 820){
      els.app.classList.add('mobile-chat');
      els.backBtn.classList.remove('hidden');
    }

    await loadMessages(c.id);
  }

  async function loadMessages(conversationId){
    els.messages.innerHTML = '<div class="empty">Cargando mensajes...</div>';

    const { data, error } = await supabaseClient
      .from('mensajes')
      .select('id,direccion,mensaje,fecha')
      .eq('conversacion_id',conversationId)
      .order('fecha',{ascending:true});

    if(error){
      els.messages.innerHTML = '<div class="empty">No se pudieron cargar los mensajes.</div>';
      return;
    }

    if(!data?.length){
      els.messages.innerHTML = '<div class="empty">Esta conversación todavía no tiene mensajes.</div>';
      return;
    }

    els.messages.innerHTML = data.map(m => `
      <div class="msg ${m.direccion === 'saliente' ? 'out' : 'in'}">
        <div>${escapeHtml(m.mensaje || '')}</div>
        <span class="msg-time">${escapeHtml(formatTime(m.fecha))}</span>
      </div>
    `).join('');

    els.messages.scrollTop = els.messages.scrollHeight;
  }

  async function startRealtime(){
    if(realtimeChannel){
      await supabaseClient.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabaseClient
      .channel('portal-nexia')
      .on(
        'postgres_changes',
        { event:'*', schema:'public', table:'conversaciones' },
        async () => {
          await loadConversations();
        }
      )
      .on(
        'postgres_changes',
        { event:'INSERT', schema:'public', table:'mensajes' },
        async payload => {
          if(conversacionActiva && payload.new?.conversacion_id === conversacionActiva.id){
            await loadMessages(conversacionActiva.id);
          }
        }
      )
      .subscribe();
  }

  async function showPortal(){
    setLoading(true);
    try{
      await loadProfile();
      await loadConversations();
      await startRealtime();

      els.loginScreen.classList.add('hidden');
      els.app.classList.remove('hidden');
    }catch(err){
      console.error(err);
      await supabaseClient.auth.signOut();
      els.loginScreen.classList.remove('hidden');
      els.app.classList.add('hidden');
      els.loginError.textContent = err.message || 'No se pudo abrir el portal.';
      els.loginError.classList.remove('hidden');
    }finally{
      setLoading(false);
    }
  }

  els.loginForm.addEventListener('submit', async e => {
    e.preventDefault();

    els.loginError.classList.add('hidden');
    setLoading(true);

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: els.email.value.trim(),
      password: els.password.value
    });

    setLoading(false);

    if(error){
      els.loginError.textContent = 'Correo o contraseña incorrectos.';
      els.loginError.classList.remove('hidden');
      return;
    }

    await showPortal();
  });

  els.logoutBtn.addEventListener('click', async () => {
    setLoading(true);
    await supabaseClient.auth.signOut();

    if(realtimeChannel){
      await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    conversaciones = [];
    conversacionActiva = null;
    els.password.value = '';
    els.app.classList.add('hidden');
    els.loginScreen.classList.remove('hidden');
    setLoading(false);
  });

  els.refreshBtn.addEventListener('click', async () => {
    setLoading(true);
    try{
      await loadConversations();
      if(conversacionActiva){
        await loadMessages(conversacionActiva.id);
      }
    }finally{
      setLoading(false);
    }
  });

  els.searchInput.addEventListener('input', renderConversations);

  els.backBtn.addEventListener('click', () => {
    els.app.classList.remove('mobile-chat');
    els.backBtn.classList.add('hidden');
  });

  // Revisar si ya existe una sesión activa.
  (async function init(){
    const { data } = await supabaseClient.auth.getSession();

    if(data?.session){
      await showPortal();
    }
  })();
</script>

</body>
</html>
