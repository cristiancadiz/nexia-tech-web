<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotizaciones · La Ortiga Recicla</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#173126;background:#f3f7f5;--g:#14865a;--line:#dbe7e1;--muted:#6a7770}*{box-sizing:border-box}body{margin:0}.top{background:#123226;color:#fff;padding:22px}.top h1{max-width:860px;margin:0 auto;font-size:1.35rem}.wrap{max-width:860px;margin:24px auto;padding:0 16px}.summary,.quote{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.quote.selected{border-color:#1a9b68;box-shadow:0 0 0 3px rgba(20,134,90,.08)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fact{background:#f7faf8;border-radius:12px;padding:11px}.fact b{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}.price{font-size:1.3rem;font-weight:900;margin:10px 0}.muted{color:var(--muted);font-size:.88rem;line-height:1.5}button{border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.ok{background:#e9f8f0;color:#17633f;border-radius:12px;padding:12px}.err{background:#fff0f0;color:#9b2929;border-radius:12px;padding:12px}.empty{text-align:center;padding:35px;color:var(--muted)}.rule{background:#eef7f2;border-radius:13px;padding:12px;margin-top:12px}.closed{background:#f2f3f2;color:#4e5a54;border-radius:13px;padding:12px;margin-top:12px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><h1>♻️ La Ortiga Recicla · Cotizaciones</h1></div>
<main class="wrap">
  <div id="status" class="empty">Cargando cotizaciones…</div>
  <div id="content"></div>
</main>
<script>
const P=new URLSearchParams(location.search),token=P.get('token')||'',API=(P.get('api')||'https://chatbot-laortiga-hddw.onrender.com').replace(/\/$/,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>v==null||v===''?'—':'$'+Number(v).toLocaleString('es-CL')+' CLP';
async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||`Error ${r.status}`);return d}
function quoteLabel(q){if(q.modalidad==='retiro_gratis')return 'Retiro gratis';if(q.modalidad==='a_convenir')return 'Monto a convenir';if(q.modalidad==='cobra_retiro')return 'Cobro '+money(q.monto_total);return 'Pago '+money(q.monto_total)}
function receptionHtml(r){
  if(!r)return '';
  const limite=r.limite_at?new Date(r.limite_at).toLocaleString('es-CL'):'';
  if(r.cerrada){
    const motivo=r.motivo==='maximo'?`Se recibieron las ${r.maximo} cotizaciones máximas.`:
      r.motivo==='plazo'?`Finalizó el plazo de ${r.plazo_horas} horas.`:
      r.motivo==='seleccionada'?'Ya seleccionaste una propuesta.':
      'La recepción de nuevas cotizaciones está cerrada.';
    return `<div class="closed"><b>Recepción de cotizaciones cerrada</b><br>${esc(motivo)}</div>`;
  }
  return `<div class="rule"><b>${esc(r.recibidas||0)} de ${esc(r.maximo||3)} cotizaciones recibidas</b><br>Podrás recibir propuestas hasta completar ${esc(r.maximo||3)} o hasta ${esc(limite||'el límite de 24 horas')}, lo que ocurra primero.</div>`;
}
async function load(){
  if(!token){document.getElementById('status').innerHTML='<div class="err">Enlace incompleto.</div>';return}
  try{
    const d=await req('/public/cotizaciones?token='+encodeURIComponent(token));
    document.getElementById('status').style.display='none';
    const s=d.solicitud||{},qs=d.cotizaciones||[],r=d.recepcion||{},sel=d.seleccionada||null;
    let h=`<section class="summary"><h2 style="margin-top:0">Tu solicitud</h2><div class="grid"><div class="fact"><b>Comuna</b>${esc(s.comuna||'—')}</div><div class="fact"><b>Material</b>${esc((s.tipos_producto||[]).join(', ')||'—')}</div><div class="fact"><b>Cantidad/peso</b>${esc(s.peso_aprox||s.cantidad_bultos||'—')}</div><div class="fact"><b>Retiro</b>${esc(s.fecha_retiro||'A coordinar')} · ${esc(s.horario_retiro||'A coordinar')}</div></div>${receptionHtml(r)}</section>`;
    if(!qs.length){
      h+='<div class="empty">Todavía no hay cotizaciones. Te avisaremos por WhatsApp cuando llegue una propuesta.</div>';
    }else{
      h+=qs.map(q=>`<section class="quote ${q.estado==='aceptada'?'selected':''}"><div class="muted">${esc(q.reciclador_nombre||'Reciclador')}</div><div class="price">${esc(quoteLabel(q))}</div>${q.tipo_tarifa&&q.tipo_tarifa!=='fijo'?`<div class="muted">Tarifa: ${esc(q.tipo_tarifa.replaceAll('_',' '))}${q.valor_unitario!=null?' · '+money(q.valor_unitario):''}${q.cantidad!=null?' × '+esc(q.cantidad):''}${q.unidad?' '+esc(q.unidad):''}</div>`:''}${q.costo_retiro>0&&q.modalidad==='paga_cliente'?`<div class="muted">Costo de retiro: ${money(q.costo_retiro)} · Neto estimado: ${money(q.monto_neto_cliente)}</div>`:''}${q.comentario?`<p>${esc(q.comentario)}</p>`:''}${q.estado==='aceptada'?'<div class="ok">✅ Cotización seleccionada. Las demás propuestas quedaron cerradas.</div>':sel?'':'<button onclick="acceptQuote(\''+esc(q.id)+'\',this)">Elegir esta cotización</button>'}</section>`).join('');
    }
    document.getElementById('content').innerHTML=h;
  }catch(e){
    document.getElementById('status').innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
}
async function acceptQuote(id,btn){if(!confirm('¿Quieres elegir esta cotización? Las demás propuestas serán rechazadas.'))return;try{btn.disabled=true;await req('/public/cotizaciones/'+encodeURIComponent(id)+'/aceptar',{method:'POST',body:JSON.stringify({token})});await load()}catch(e){alert(e.message);btn.disabled=false}}
load();
</script>
</body>
</html>
