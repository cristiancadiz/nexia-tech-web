<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexia Tech</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #1f1f1f;
    }

    /* =========================
       BOTÓN FLOTANTE WHATSAPP
    ========================== */

    .nexia-whatsapp-float {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;

      width: 64px;
      height: 64px;

      padding: 0 15px;

      background: #25D366;
      color: #ffffff;

      border-radius: 999px;

      text-decoration: none;

      overflow: hidden;

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);

      transition:
        width 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .nexia-whatsapp-float svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .nexia-whatsapp-text {
      white-space: nowrap;

      font-size: 15px;
      font-weight: 700;

      opacity: 0;
      transform: translateX(8px);

      transition:
        opacity 0.25s ease,
        transform 0.3s ease;
    }

    .nexia-whatsapp-float:hover {
      width: 230px;
      transform: scale(1.06);

      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.30);
    }

    .nexia-whatsapp-float:hover .nexia-whatsapp-text {
      opacity: 1;
      transform: translateX(0);
    }

    /* =========================
       VERSIÓN MÓVIL
    ========================== */

    @media (max-width: 600px) {

      .nexia-whatsapp-float {
        right: 16px;
        bottom: 16px;

        width: 58px;
        height: 58px;

        padding: 0 12px;
      }

      .nexia-whatsapp-float svg {
        width: 32px;
        height: 32px;
      }

      .nexia-whatsapp-float:hover {
        width: 215px;
      }
    }
  </style>
</head>
